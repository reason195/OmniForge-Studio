[package]
name = "omniforge-studio"
version = "0.1.0"
description = "OmniForge Studio — AutoJs6 Automation Workflow Builder with Dual MCP & Redaction Pipeline"
authors = ["OmniForge Studio"]
edition = "2021"

[lib]
name = "omniforge_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
