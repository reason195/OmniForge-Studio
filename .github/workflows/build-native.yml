name: Build Native Apps (Windows EXE & Android APK)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-gate:
    name: TypeScript, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Run TypeScript lint check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Vite frontend
        run: npm run build

  build-windows:
    name: Build Windows Installer (.exe)
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Generate native icons from app-icon.png
        run: npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/app-icon.png

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Windows NSIS (.exe)
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniForge-Studio-Windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android Package (.apk)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NOTE: android-actions/setup-android@v3 is broken with current runner
      # images (it tries to install the removed legacy 'tools' package and
      # sdkmanager exits 1). GitHub ubuntu runners ship a preinstalled
      # Android SDK at $ANDROID_HOME, so use it directly.
      - name: Install Android SDK Build-Tools & NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Generate native icons from app-icon.png
        run: npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/app-icon.png

      - name: Initialize Tauri Android project
        run: npx --yes @tauri-apps/cli@^2 android init --ci

      - name: Inject localhost cleartext network_security_config.xml
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          cp src-tauri/android/network_security_config.xml src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            let xml = fs.readFileSync(process.argv[1], "utf8");
            if (!xml.includes("android.permission.INTERNET")) {
              xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application");
            }
            if (!xml.includes("android:networkSecurityConfig")) {
              xml = xml.replace("<application", "<application android:networkSecurityConfig=\"@xml/network_security_config\"");
            }
            fs.writeFileSync(process.argv[1], xml);
          ' "$MANIFEST"

      - name: Build Android APK
        run: npx --yes @tauri-apps/cli@^2 android build --apk --target aarch64

      - name: Upload Android .apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniForge-Studio-Android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "OmniForge Studio $TAG" --generate-notes
          fi
          mkdir -p dist-release
          find release-assets -name '*.exe' -exec cp {} dist-release/ \;
          find release-assets -name '*.apk' -exec cp {} dist-release/ \;
          ls -la dist-release
          gh release upload "$TAG" --repo "$REPO" --clobber dist-release/*
